services:
  postgres:
    image: postgres:17-alpine
    container_name: team-task-postgres
    # 重启策略
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 时区设置
      TZ: UTC
    ports:
      - '${POSTGRES_PORT}:5432'
    # 数据卷挂载
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 可选：用 Nginx 托管 web/dist，并把 /api 反代到宿主机 3001。
  # 放在 preview profile 里，默认 `docker compose up -d` 不会启动它 ——
  # 否则 web/dist 还没构建时会挂一个空站点，Linux 上还会把宿主机目录建出来。
  # 用法：npm run build:web && docker compose --profile preview up -d nginx
  nginx:
    image: nginx:alpine
    container_name: team-task-nginx
    profiles: ['preview']
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      # 只读挂载构建产物与配置；改前端代码后必须重新 build
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Linux 上让容器能通过 host.docker.internal 访问宿主机；
      # Docker Desktop（Windows / macOS）原生支持，重复声明无害
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
