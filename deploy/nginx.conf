# team-task 前端静态站点 + API 反向代理。
#
# 由 compose.yml 的 nginx 服务挂载到 /etc/nginx/conf.d/default.conf。
# 使用前提：宿主机先执行 `npm run build:web`，产物在 web/dist。
# 前后端同源（都走 http://localhost:8080），所以后端不需要开 CORS。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 前端请求 /api/*，转发到宿主机上 3001 的 NestJS。
    # proxy_pass 末尾不要加斜杠：加了会把 /api 前缀剥掉，后端全部 404。
    location /api/ {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite 产物文件名带内容哈希，可以长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口文件不缓存：避免部署后浏览器仍拿旧 index.html 引用已删除的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 使用 BrowserRouter：刷新 /tasks/xxx 必须回退到 index.html，
    # 否则 Nginx 会直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
